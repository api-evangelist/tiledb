identity_model:
  addressing: Assets are addressed as {namespace}/{name} in the URI path — the namespace is a user or an organization,
    and the name is the array, group, notebook, UDF, ML model or file. Many endpoints accept a UUID in the same position.
  uri_scheme: tiledb://{namespace}/{name} is the canonical TileDB Cloud URI the client libraries consume.
  no_prefixed_ids: TileDB does not use typed/prefixed object ids (no acct_, arr_ style). Identifiers are bare UUIDs
    or namespace/name pairs.
