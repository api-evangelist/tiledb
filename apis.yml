apis:
- name: TileDB Storage Platform API (v1)
  description: >-
    The primary TileDB Cloud REST API. 168 operations across arrays, groups, assets, files, notebooks,
    UDFs, task graphs, SQL, queries, users, organizations, invitations, favorites and tokens. Published
    by TileDB as a Swagger 2.0 contract with basePath /v1. Authenticates with an X-TILEDB-REST-API-KEY
    header, HTTP Basic, or OAuth 2.0 authorization code. Bodies negotiate between application/json and
    application/capnp (Cap'n Proto) for the high-throughput query paths.
  image: https://images.ctfassets.net/nxe07oerbx6d/PTO0pDBxwkIxfaGzEiHPi/931e190a336eebdedc825cba1723b96b/TileDB-homepage-meta.jpg
