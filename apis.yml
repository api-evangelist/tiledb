aid: tiledb
name: TileDB
description: >-
  TileDB, Inc. builds a multimodal database around a single universal data model — the multi-dimensional
  array — that stores tables, genomics (VCF), single-cell (SOMA), biomedical imaging, vector embeddings,
  point clouds, files and ML models in one cloud-native format on S3, Azure Blob, GCS, Lustre or MinIO.
  The open-source TileDB Embedded storage engine is paired with TileDB Cloud (and the Carrara product
  line), a hosted and self-hostable platform for cataloging, sharing, governing and querying those assets,
  with serverless SQL, user-defined functions, task graphs, Jupyter notebooks and dashboards. The platform
  is programmable through the TileDB Storage Platform REST API (v1 and v2, whose Swagger 2.0 contracts
  TileDB publishes openly on GitHub), plus first-party clients for Python, R, Java, Go, C, C++, C#,
  JavaScript and Rust. The company is focused on life sciences and precision medicine.
