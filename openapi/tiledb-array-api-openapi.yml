components:
  schemas:
    ArraySample:
      type: object
      description: Sample data from array
      properties:
        data:
          additionalProperties:
            type: object
    LoadEnumerationsResponse:
      description: Contains the enumerations of the array's attributes
      type: object
      properties:
        enumerations:
          type: array
          items:
            $ref: '#/components/schemas/Enumeration'
    PricingCurrency:
      description: Currency of pricing
      type: string
      enum:
      - USD
    Subscription:
      description: Subscription of a user (customer) to another user's arrays
      type: object
      properties:
        id:
          description: Unique ID of subscription as defined by Stripe
          type: string
          example: subscriptionID
        owner_namespace_uuid:
          description: Unique ID of the array (product) owner
          type: string
          example: 00000000-0000-0000-0000-000000000000
        customer_namespace_uuid:
          description: Unique ID of the array (product) user (customer)
          type: string
          example: 00000000-0000-0000-0000-000000000000
        pricing:
          description: list of pricing used by this subscription
          type: array
          x-omitempty: true
          items:
            $ref: '#/components/schemas/Pricing'
    Attribute:
      description: Attribute of array
      type: object
      required:
      - name
      - type
      - filterPipeline
      - cellValNum
      properties:
        name:
          description: Attribute name
          type: string
          example: attribute1
        type:
          $ref: '#/components/schemas/Datatype'
        filterPipeline:
          $ref: '#/components/schemas/FilterPipeline'
        cellValNum:
          description: Attribute number of values per cell
          type: integer
          example: 1
        nullable:
          description: Is attribute nullable
          type: boolean
          example: true
        fillValue:
          description: The default fill value
          type: array
          items:
            type: integer
            format: uint8
    Error:
      type: object
      properties:
        code:
          type: integer
          format: int64
        message:
          type: string
        request_id:
          type: string
    ArrayMetadataEntry:
      type: object
      description: key/value pair representing an array metadata map entry
      properties:
        key:
          type: string
        type:
          type: string
        valueNum:
          type: integer
          format: uint32
        value:
          type: array
          items:
            type: integer
            format: uint8
        del:
          type: boolean
    ArrayInfoUpdate:
      description: metadata of an array
      type: object
      properties:
        description:
          description: description of array
          type:
          - string
          - 'null'
        name:
          description: description of array
          type: string
          example: myarray1
        uri:
          description: uri of array
          type: string
          example: s3://bucket/array
        file_type:
          description: File type stored /wrapped by this array
          x-omitempty: true
          $ref: '#/components/schemas/FileType'
        file_properties:
          type: object
          description: map of file properties created for this array
          x-omitempty: true
          additionalProperties:
            type: string
        access_credentials_name:
          description: the name of the access credentials to use. if unset, the default credentials will be used
          type: string
        logo:
          description: logo (base64 encoded) for the array. Optional
          type: string
        tags:
          description: optional tags for array
          x-omitempty: false
          type: array
          items:
            type: string
            description: tag must be lowercase characters or hypen [a-z-]
        license_id:
          type: string
          x-omitempty: true
          description: License identifier from SPDX License List or Custom
        license_text:
          type: string
          x-omitempty: true
          description: License text
        read_only:
          description: Suggests if the array is in read_only mode
          type: boolean
          x-omitempty: true
          example: true
    DomainArray:
      description: Domain object for an array of each type
      type: object
      properties:
        int8:
          type: array
          x-omitempty: true
          items:
            type: integer
            format: int8
        uint8:
          type: array
          x-omitempty: true
          items:
            type: integer
            format: uint8
        int16:
          type: array
          x-omitempty: true
          items:
            type: integer
            format: int16
        uint16:
          type: array
          x-omitempty: true
          items:
            type: integer
            format: uint16
        int32:
          type: array
          x-omitempty: true
          items:
            type: integer
            format: int32
        uint32:
          type: array
          x-omitempty: true
          items:
            type: integer
            format: uint32
        int64:
          type: array
          x-omitempty: true
          items:
            type: integer
            format: int64
        uint64:
          type: array
          x-omitempty: true
          items:
            type: integer
            format: uint64
        float32:
          type: array
          x-omitempty: true
          items:
            type: number
            format: float
        float64:
          type: array
          x-omitempty: true
          items:
            type: number
            format: double
    ArraySharing:
      description: details for sharing a given array
      type: object
      properties:
        actions:
          description: List of permitted actions
          type: array
          x-omitempty: true
          items:
            $ref: '#/components/schemas/ArrayActions'
          example:
          - read
          - write
        namespace:
          description: namespace being granted array access can be a user or organization
          type: string
          example: MyOrganization
        namespace_type:
          description: details on if the namespace is a organization or user
          type: string
          example: organization
    TileDBConfig:
      description: TileDB config used for interaction with the embedded library
      type: object
      properties:
        entries:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              value:
                type: string
    MetadataStringifiedEntry:
      type: object
      description: key/value pair representing an asset metadata map entry
      properties:
        key:
          description: The metadata key
          type: string
          x-omitempty: false
        value:
          description: The metadata value
          type: string
          x-omitempty: false
        type:
          description: The metadata type
          type: string
          x-omitempty: false
          example: array_metadata
    Filter:
      description: Filter
      type: object
      required:
      - type
      properties:
        type:
          description: Filter type
          $ref: '#/components/schemas/FilterType'
        data:
          description: Filter data
          type: object
          properties:
            int8:
              type: integer
              format: int8
            uint8:
              type: integer
              format: uint8
            int16:
              type: integer
              format: int16
            uint16:
              type: integer
              format: uint16
            int32:
              type: integer
              format: int32
            uint32:
              type: integer
              format: uint32
            int64:
              type: integer
              format: int64
            uint64:
              type: integer
              format: uint64
            float32:
              type: integer
              format: float
            float64:
              type: integer
              format: double
    LoadArraySchemaResponse:
      description: Contains the latest schema and all schemas for the opened array
      type: object
      properties:
        latest_array_schema:
          $ref: '#/components/schemas/ArraySchema'
        all_array_schemas:
          description: map of all array schemas
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ArraySchema'
    Pricing:
      description: Pricing created by converting an array to product
      type: object
      properties:
        id:
          description: Unique ID of plan as defined by Stripe
          type: string
          example: planID
        array_uuid:
          description: Unique ID of registered array
          type: string
          example: 00000000-0000-0000-0000-000000000000
        pricing_name:
