openapi: 3.2.0
info:
  description: TileDB Storage Platform REST API
  title: TileDB Storage Platform Task Graphs API
  version: 2.17.51
servers:
- url: /v1
security:
- BasicAuth: []
- ApiKeyAuth: []
tags:
- name: task_graphs
paths:
  /taskgraphs/{namespace}/graphs:
    get:
      description: 'Fetch the task graphs of a namespace the user has access to. The returned entries will include only summary data, and will not include information about the individual tasks that were executed. (This information is available when requesting an individual task graph log.)

        Entries in the response are ordered from newest to oldest. Pagination parameters work as in other API methods; see PaginationMetadata.'
      operationId: listTaskGraphs
      parameters:
      - name: namespace
        in: path
        description: Namespace for graphs
        required: true
        schema:
          type: string
      tags:
      - task_graphs
      responses:
        200:
          description: The task graphs that matched the user's query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskGraphs'
        502:
          description: Bad Gateway
        default:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: List task graphs
      x-summary-source: derived
    post:
      description: Create a single task graph for execution.
      operationId: createTaskGraph
      tags:
      - task_graphs
      parameters:
      - name: namespace
        in: path
        description: Include graphs for this namespace.
        required: true
        schema:
          type: string
      responses:
        201:
          description: Task graph created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskGraph'
        502:
          description: Bad Gateway
        default:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskGraph'
        description: Create the task graph.
        required: true
      summary: Create task graph
      x-summary-source: derived
  /taskgraphs/{namespace}/graphs/{id}:
    parameters:
    - name: namespace
      in: path
      description: The namespace that owns this task graph.
      required: true
      schema:
        type: string
    - name: id
      in: path
      description: The UUID of the task graph entry.
      required: true
      schema:
        type: string
    get:
      description: Fetch information about a single task graph.
      operationId: getTaskGraph
      tags:
      - task_graphs
      responses:
        200:
          description: Information about the single task graph.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskGraph'
        502:
          description: Bad Gateway
        default:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: Get task graph
      x-summary-source: derived
    patch:
      description: Update information about a single task graph execution.
      operationId: updateTaskGraph
      tags:
      - task_graphs
      responses:
        204:
          description: Task graph created successfully.
        502:
          description: Bad Gateway
        default:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskGraph'
        description: Updates to make to the task graph.
        required: true
      summary: Update task graph
      x-summary-source: derived
  /taskgraphs/{namespace}/graphs/{id}/submit:
    parameters:
    - name: namespace
      in: path
      description: The namespace that owns this task graph.
      required: true
      schema:
        type: string
    - name: id
      in: path
      description: The UUID of the task graph entry.
      required: true
      schema:
        type: string
    post:
      description: Submit a single task graph for execution.
      operationId: submitTaskGraph
      tags:
      - task_graphs
      responses:
        202:
          description: Information about the execution of a single task graph.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskGraphLog'
        502:
          description: Bad Gateway
        default:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: Submit task graph
      x-summary-source: derived
components:
  schemas:
    QueryRanges:
      description: Subarray bounds to query
      type: object
      properties:
        layout:
          $ref: '#/components/schemas/Layout'
        ranges:
          description: List of ranges,
          type: array
          x-omitempty: true
          items:
            type: array
            x-omitempty: true
            items:
              type: number
    Querytype:
      description: Type of query
      type: string
      enum:
      - READ
      - WRITE
      - DELETE
    Backoff:
      description: Backoff is a backoff strategy to use within retryStrategy
      type: object
      properties:
        duration:
          description: Duration is the amount to back off. Default unit is seconds, but could also be a duration (e.g. "2m", "1h")
          type: string
        factor:
          description: Factor is a factor to multiply the base duration after each failed retry
          type: integer
          format: uint32
        maxDuration:
          description: MaxDuration is the maximum amount of time allowed for the backoff strategy
          type: string
    PricingCurrency:
      description: Currency of pricing
      type: string
      enum:
      - USD
    Subscription:
      description: Subscription of a user (customer) to another user's arrays
      type: object
      properties:
        id:
          description: Unique ID of subscription as defined by Stripe
          type: string
          example: subscriptionID
        owner_namespace_uuid:
          description: Unique ID of the array (product) owner
          type: string
          example: 00000000-0000-0000-0000-000000000000
        customer_namespace_uuid:
          description: Unique ID of the array (product) user (customer)
          type: string
          example: 00000000-0000-0000-0000-000000000000
        pricing:
          description: list of pricing used by this subscription
          type: array
          x-omitempty: true
          items:
            $ref: '#/components/schemas/Pricing'
    Error:
      type: object
      properties:
        code:
          type: integer
          format: int64
        message:
          type: string
        request_id:
          type: string
    RetryPolicy:
      description: RetryPolicy is a policy of node statuses that will be retried
      type: string
      enum:
      - Always
      - OnFailure
      - OnError
      - OnTransientError
    ArrayTaskType:
      description: Synchronous Task Type
      type: string
      enum:
      - SQL
      - UDF
      - QUERY
      - GENERIC_UDF
      - BATCH_UDF
      - CLIENT_COMPUTATION
    ResultFormat:
      description: Data format of a result
      type: string
      enum:
      - python_pickle
      - r_serialization
      - json
      - arrow
      - bytes
      - tiledb_json
      - native
    DomainArray:
      description: Domain object for an array of each type
      type: object
      properties:
        int8:
          type: array
          x-omitempty: true
          items:
            type: integer
            format: int8
        uint8:
          type: array
          x-omitempty: true
          items:
            type: integer
            format: uint8
        int16:
          type: array
          x-omitempty: true
          items:
            type: integer
            format: int16
        uint16:
          type: array
          x-omitempty: true
          items:
            type: integer
            format: uint16
        int32:
          type: array
          x-omitempty: true
          items:
            type: integer
            format: int32
        uint32:
          type: array
          x-omitempty: true
          items:
            type: integer
            format: uint32
        int64:
          type: array
          x-omitempty: true
          items:
            type: integer
            format: int64
        uint64:
          type: array
          x-omitempty: true
          items:
            type: integer
            format: uint64
        float32:
          type: array
          x-omitempty: true
          items:
            type: number
            format: float
        float64:
          type: array
          x-omitempty: true
          items:
            type: number
            format: double
    TaskGraphs:
      description: Information about a series of task graphs.
      type: object
      properties:
        graphs:
          type: array
          items:
            $ref: '#/components/schemas/TaskGraph'
          description: 'The series of graphs.

            '
    TaskGraphNodeMetadata:
      description: Metadata about an individual node in a task graph.
      type: object
      properties:
        client_node_uuid:
          type: string
          description: The client-generated UUID of the given graph node.
        name:
          type: string
          maxLength: 255
          description: 'The client-generated name of the node. This is not guaranteed to be unique.

            '
        depends_on:
          type: array
          items:
            type: string
          description: 'The client_node_uuid of each node that this node depends upon. Used to define the structure of the graph.

            '
        run_location:
          $ref: '#/components/schemas/TaskGraphLogRunLocation'
        status:
          description: 'If present, the overall execution status of this node, taking into account the latest execution information.

            For nodes that have not yet been executed, this will be listed as `QUEUED`. For nodes that are set to run locally and have not reported any status information, this will be listed as `UNKNOWN`.

            '
          $ref: '#/components/schemas/ArrayTaskStatus'
        status_message:
          description: The reason the array task status is in the state
          type:
          - string
          - 'null'
          x-omitempty: true
        executions:
          type: array
          items:
            $ref: '#/components/schemas/ArrayTask'
          readOnly: true
          description: 'ArrayTasks representing each execution attempt for this node. For nodes that have never been submitted, this will be empty. For nodes that have been retried, this may have multiple entries. The last one in the list represents the most recent execution.

            This is read-only and generated by the server based on the tasks it has actually executed.

            '
    UDFLanguage:
      description: UDF Type
      type: string
      enum:
      - python
      - r
    MetadataStringifiedEntry:
      type: object
      description: key/value pair representing an asset metadata map entry
      properties:
        key:
          description: The metadata key
          type: string
          x-omitempty: false
        value:
          description: The metadata value
          type: string
          x-omitempty: false
        type:
          description: The metadata type
          type: string
          x-omitempty: false
          example: array_metadata
    TGUDFArgument:
      description: 'A single argument to a UDF. This may represent a positional argument or a named argument, depending upon whether `name` is set.

        '
      type: object
      properties:
        name:
          description: The name of the argument, if present.
          type:
          - string
          - 'null'
        value:
          $ref: '#/components/schemas/TGArgValue'
    Pricing:
      description: Pricing created by converting an array to product
      type: object
      properties:
        id:
          description: Unique ID of plan as defined by Stripe
          type: string
          example: planID
        array_uuid:
          description: Unique ID of registered array
          type: string
          example: 00000000-0000-0000-0000-000000000000
        pricing_name:
          description: Name of pricing
          type: string
        pricing_type:
          description: Type of pricing
          $ref: '#/components/schemas/PricingType'
        product_name:
          description: Name of product
          type: string
        product_statement_descriptor:
          description: Extra information about a product which will appear on the credit card statement of the customer
          type: string
        product_unit_label:
          description: A label that represents units of this product in Stripe and receipts and invoices of the customer
          $ref: '#/components/schemas/PricingUnitLabel'
        currency:
          description: Currency of pricing
          $ref: '#/components/schemas/PricingCurrency'
        aggregate_usage:
          description: Specifies a usage aggregation strategy for pricings of usage_type=metered
          $ref: '#/components/schemas/PricingAggregateUsage'
        interval:
          description: The frequency with which a subscription should be billed
          $ref: '#/components/schemas/PricingInterval'
        divided_by:
          description: Group of n product unit labels
          type: integer
          format: int64
          example: 1048576
        charge:
          description: Price in cents (decimal) per unitlabel
          type: number
          format: double
        activated:
          description: If pricing is activated
          type: boolean
          example: false
    ArrayTaskStatus:
      description: Status of array task
      type: string
      enum:
      - QUEUED
      - FAILED
      - COMPLETED
      - RUNNING
      - RESOURCES_UNAVAILABLE
      - UNKNOWN
      - CANCELLED
      - DENIED
    Layout:
      description: Layout of array
      type: string
      enum:
      - row-major
      - col-major
      - global-order
      - unordered
    TaskGraph:
      description: Information about a task graph.
      type: object
      properties:
        uuid:
          type: string
          readOnly: true
          description: The server-generated UUID of the task graph.
        namespace:
          type: string
          description: 'The namespace that owns this task graph. When creating a task graph log, this is used as the namespace to create the log in; thereafter it is read-only.

            '
        created_by:
          type: string
          readOnly: true
          description: The name of the user who created this task graph log.
        name:
          type: string
          maxLength: 255
          description: 'A name for this task graph, displayed in the UI. Does not need to be unique.

            '
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: 'The date/time when this task graph was originally created.

            '
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/TaskGraphNode'
          description: 'The structure of the graph. This is provided by the client when first setting up the task graph. This must be topographically sorted; that is, each node must appear after all nodes that it depends upon.

            '
        parallelism:
          type:
          - integer
          - 'null'
          format: int64
          x-omitempty: true
          description: 'Parallelism limits the max total parallel pods that can execute at the same time in a workflow.

            '
        retry_strategy:
          $ref: '#/components/schemas/RetryStrategy'
        deadline:
          type:
          - integer
          - 'null'
          format: int64
          x-omitempty: true
          description: 'Duration in seconds relative to the workflow start time which the workflow is allowed to run before it gets terminated. Defaults to 24h when unset

            '
        task_graph_type:
          $ref: '#/components/schemas/TaskGraphType'
    PricingUnitLabel:
      description: Unit label
      type: string
      enum:
      - byte
      - second
    UDFArrayDetails:
      description: Contains array details for multi-array query including uri, ranges buffers
      type: object
      properties:
        parameter_id:
          description: 'An optional client-generated identifier to distinguish between multiple range/buffer requests from the same array in the same call.

            This may be set for MultiArrayUDFs that use the `argument_json` style of passing arrays.

            '
          type:
          - string
          - 'null'
          x-omitempty: true
        uri:
          description: array to set ranges and buffers on, must be in tiledb:// format
          type: string
        ranges:
          description: ranges to run against, generic format
          $ref: '#/components/schemas/QueryRanges'
        buffers:
          description: List of buffers to fetch (attributes + dimensions)
          type: array
          x-omitempty: true
          items:
            type: string
    FileType:
      description: File types represented as TileDB arrays
      type: string
      enum:
      - notebook
      - user_defined_function
      - ml_model
      - file
      - registered_task_graph
    TGUDFEnvironment:
      description: Metadata about the environment where we want to execute a UDF.
      type: object
      properties:
        language:
          $ref: '#/components/schemas/UDFLanguage'
        language_version:
          description: 'The language version used to execute this UDF. Neither this nor `language` needs to be set for registered UDFs, since the language and version are stored server-side with the UDF itself.

            '
          type: string
        image_name:
          description: 'The name of the image to use for the execution environment.

            '
          type: string
        access_credentials_name:
          description: 'The name of the access credentials to use. if unset, no credentials will be configured in the environment.

            '
          type: string
        namespace:
          description: 'If set, the non-default namespace to execute this UDF under (and to query any Array Nodes that are used as inputs to this UDF).

            '
          type:
          - string
          - 'null'
        resource_class:
          description: 'The resource class to use for the UDF execution. Resource classes define resource limits for memory and CPUs. If this is empty, then the UDF will execute in the standard resource class of the TileDB Cloud provider.

            '
          type: string
          x-omitempty: true
        resources:
          type: object
          description: 'The resources requested for this particular node. If resources are not specified resource_class is used, if it is not set the standard resource // defaults are used

            '
          properties:
            cpu:
              type: string
              example: 500m
            memory:
              type: string
              example: 8Gi
            gpu:
              type: integer
              example: 1
          x-omitempty: true
        run_client_side:
          description: 'A hint that, if possible, this function should be executed on the client side rather than on the server. Registered UDFs and functions which take arrays as inputs can never be executed client-side. If the client’s environment is incompatible, or the client does not support client-side execution, the function will be executed on the server.

            '
          type: boolean
          x-omitempty: true
        timeout:
          description: 'The maximum length of time this UDF is allowed to execute for before it is killed and fails. If not present (or zero), the function is allowed to run indefinitely (subject to the server’s global limits).

            '
          type:
          - number
          - 'null'
    TaskGraphNode:
      description: 'Information about a single node within a registered task graph. A single node represents one piece of data or a computational step; either as an input value, a data source, or a computation that acts upon earlier nodes. The structure parallels the existing `TaskGraphNodeMetadata`.

        '
      type: object
      properties:
        client_node_id:
          type: string
          description: The client-generated UUID of the given graph node.
        name:
          type:
          - string
          - 'null'
          maxLength: 255
          description: 'A client-specified name for the node. If provided, this must be unique.

            '
        depends_on:
          type: array
          items:
            type: string
          description: 'The client_node_uuid of each node that this node depends upon. Used to define the structure of the graph.

            '
        array_node:
          $ref: '#/components/schemas/UDFArrayDetails'
        input_node:
          $ref: '#/components/schemas/TGInputNodeData'
        sql_node:
          $ref: '#/components/schemas/TGSQLNodeData'
        udf_node:
          $ref: '#/components/schemas/TGUDFNodeData'
        retry_strategy:
          $ref: '#/components/schemas/RetryStrategy'
        expand_node_output:
          type:
          - string
          - 'null'
          description: 'Used to create dynamic tasks based on the output of another node. The other node''s output must be a JSON list of values. The expansion process creates one task per item in the output list. The item is also passed as an argument to each task. The value is the client_node_uuid of the node that we want to expand.

            '
        deadline:
          type:
          - integer
          - 'null'
          format: int64
          x-omitempty: true
          description: 'Duration in seconds relative to the node start time which the node is allowed to run before it gets terminated.

            '
    TGArgValue:
      description: "An argument provided to a node. This is one of a direct value (i.e., a raw JSON value) or a `TGSentinel`.\nFor example this Python value:\n\n    {\"a\": [1, \"pipe\", range(30), None], \"b\": b\"bytes\"}\n\nis encoded thusly (with included comments):\n\n    {  // A dictionary with string keys is JSON-encodable.\n      \"a\": [  // As is a list.\n        1,\n        \"pipe\",\n        {  // A `range` is replaced with its pickle.\n          \"__tdbudf__\": \"immediate\",\n          \"format\": \"python_pickle\",\n          \"base64_data\": \"gASVIAAAAAAAAACMCGJ1aWx0aW5zlIwFcmFuZ2WUk5RLAEseSwGHlFKULg==\"\n        },\n        null\n      ],\n      \"b\": {  // Raw binary data is encoded into base64.\n        \"__tdbudf__\": \"immediate\"\n        \"format\": \"bytes\",\n        \"base64_data\": \"Ynl0ZXM=\"\n      }\n    }\n"
    PricingInterval:
      description: Interval for pricing
      type: string
      enum:
      - month
    ArrayActivityLog:
      description: Actvity of an Array
      type: object
      properties:
        event_at:
          description: time event took place (RFC3339)
          type: string
          format: date-time
        action:
          description: Type of the event
          $ref: '#/components/schemas/ActivityEventType'
        username:
          description: User who performed action
          type: string
          example: user1
        bytes_sent:
          description: Bytes sent to client
          type: integer
          format: uint64
          example: 1073741824
        bytes_received:
          description: Bytes recieved from client
          type: integer
          format: uint64
          example: 1073741824
        array_task_id:
          description: UUID of associated array task
          type: string
          example: 00000000-0000-0000-0000-000000000000
        id:
          description: ID of the activity
          type: string
          example: 00000000-0000-0000-0000-000000000000
        query_ranges:
          description: ranges for query
          x-omitempty: true
          type: string
          example: '{"rows":[{"start": 1, "end": 1},{"start": 3, "end": 4}],"cols":[{"start": 1, "end": 4}]}'
        query_stats:
          description: stats for query
          x-omitempty: true
          type: string
          example: '{"timers": {"Context.StorageManager.read_load_array_schema_from_uri.sum": 0.0255293, "...": "..."}, "counters": {"Context.StorageManager.read_unfiltered_byte_num": 191, "...": "..."}}'
    ArrayTask:
      description: Synchronous Task to Run
      type: object
      properties:
        id:
          description: task ID
          type: string
        name:
          description: Optional task name
          type: string
          example: subarray-multiplier
        username:
          description: username that executed this task
          type: string
          example: demo
        description:
          description: Optional task description (Tasks purpose)
          type: string
          example: Return attr a1 in the subarray bounded by coordinates and multiply attr1 by 2
        array_metadata:
          description: Metadata of the array used in the context of this task
          $ref: '#/components/schemas/ArrayInfo'
        subarray:
          description: A subarray to run the array task on
          $ref: '#/components/schemas/DomainArray'
          example:
          - Dim1:
              Int64: 0 10
            Dim2:
              Int64: 20 22
            Dim3:
              Int64: 10000 10100
        memory:
          description: memory allocated to task in bytes
          type: integer
          format: uint64
          example: 1073741824
        cpu:
          description: millicpu allocated to task
          type: integer
          format: uint64
          example: 4000
        namespace:
          type: string
          description: namespace task is tied to
          example: organization1
        status:
          description: The status of an individual task
          $ref: '#/components/schemas/ArrayTaskStatus'
        status_message:
          description: The reason the array task status is in the state
          type:
          - string
          - 'null'
          x-omitempty: true
        start_time:
          description: Start time RFC3339 for job
          type:
          - string
          - 'null'
          format: date-time
        finish_time:
          description: Finish time RFC3339 for job
          type:
          - string
          - 'null'
          format: date-time
        cost:
          description: Total accumulated for task in USD, example is $0.12
          type: number
          format: double
          example: 0.12
        egress_cost:
          description: Total accumulated for egress task in USD, example is $0.12
          type: number
          format: double
          example: 0.12
        access_cost:
          description: Cost accumulated for access task in USD, example is $0.12
          type: number
          format: double
          example: 0.12
        query_type:
          description: If task type is query, whether it's a read or write query
          $ref: '#/components/schemas/Querytype'
        udf_code:
          description: Optional actual code that is going to be executed
          type: string
        udf_language:
          description: Optional actual language used to express udf_code
          type: string
        sql_query:
          description: Optional actual sql query that is going to be executed
          type: string
        type:
          description: Type of task
          $ref: '#/components/schemas/ArrayTaskType'
        activity:
          description: Array activity logs for task
          type: array
          x-omitempty: true
          items:
            $ref: '#/components/schemas/ArrayActivityLog'
        logs:
          description: logs from array task
          type: string
          x-omitempty: false
        duration:
          description: duration in nanoseconds of an array task
          type: number
          example: 341000000000
        sql_init_commands:
          description: SQL queries or commands to run before main sql query
          type: array
          items:
            type: string
            description: sql query or command to run before main sql query
        sql_parameters:
          description: SQL query parameters
          type: array
          items: {}
        result_format:
          $ref: '#/components/schemas/ResultFormat'
          description: type of results (native, i.e cloud pickle or json or arrow)
          x-omitempty: true
        task_graph_uuid:
          type: string
          x-omitempty: true
          description: 'If set, the ID of the log for the task graph that this was part of.

            '
        client_node_uuid:
          type: string
          x-omitempty: true
          description: 'If set, the client-defined ID of the node within this task''s graph.

            '
        cloud_provider:
          type: string
          x-omitempty: true
          description: The name of the cloud provider where this task executed.
        cloud_region:
          type: string
          x-omitempty: true
          description: The region of the cloud provider where this task executed.
    TGSQLNodeData:
      description: 'A node specifying an SQL query to execute in TileDB Cloud.

        '
      type:
      - object
      - 'null'
      properties:
        init_commands:
          description: The commands to execute before running the query itself.
          type: array
          items:
            type: string
        query:
          description: 'The text of the SQL query to execute. Parameters are substituted in for `?`s, just as in a regular MariaDB query.

            '
          type: string
        parameters:
          description: 'The parameters to substitute in for arguments in the `query`. Fixed-length. Arguments must be in JSON format.

            '
          type: array
          items:
            $ref: '#/components/schemas/TGArgValue'
        result_format:
          $ref: '#/components/schemas/ResultFormat'
        namespace:
          description: 'If set, the non-default namespace to execute this SQL query under.

            '
          type:
          - string
          - 'null'
    TGUDFNodeData:
      description: A node specifying the execution of a user-defined function.
      type:
      - object
      - 'null'
      properties:
        registered_udf_name:
          description: 'If set, the name of the registered UDF to execute, in the format `namespace/name`. Either this or `executable_code` should be set, but not both.

            '
          type:
          - string
          - 'null'
        executable_code:
          description: 'If set, the base64 serialization of the code for this step, encoded in a language-specific format (e.g. Pickle for Python, serialization for R).

            '
          type:
          - string
          - 'null'
        source_text:
          description: 'Optionally, the source text for the code passed in `executable_code`. *For reference only; only the code in `executable_code` is actually executed.* This will be included in activity logs and may be useful for debugging.

            '
          type: string
        environment:
          $ref: '#/components/schemas/TGUDFEnvironment'
        arguments:
          description: "The arguments to a UDF function. This encompasses both named and positional arguments. The format is designed to provide compatibility across languages like Python which have a fairly traditional split between positional arguments and named arguments, and languages like R which has a rather unique way of specifying arguments.\nFor Python (and most other languages), all positional arguments will come before all named arguments (if any are present):\n\n    // fn(arg1, arg2, arg3)\n    [\n      {value: arg1},\n      {value: arg2},\n      {value: arg3},\n    ]\n    // fn(arg1, arg2, n=kw1, a=kw2)\n    [\n      {value: arg1},\n      {value: arg2},\n      {name: \"n\", value: kw1},\n      {name: \"a\", value: kw2},\n    ]\n    // fn(kw=k1, only=k2)\n    [\n      {name: \"kw\", value: k1},\n      {name: \"only\", value: k2},\n    ]\n\nHowever, in R, named and positional arguments may be intermixed freely:\n\n    // fn(arg, n=kw1, arg2)\n    [\n      {value: arg},\n      {name: \"n\", value: kw1},\n      {value: arg2},\n    ]\n"
          type: array
          items:
            $ref: '#/components/schemas/TGUDFArgument'
        result_format:
          $ref: '#/components/schemas/ResultFormat'
    PricingType:
      description: Pricing types
      type: string
      enum:
      - egress
      - access
    TGInputNodeData:
      description: 'Specifies that a node is an “input value”, allowing for parameterized task graphs. An input node may not depend upon any other nodes.

        '
      type:
      - object
      - 'null'
      properties:
        default_value:
          $ref: '#/components/schemas/TGArgValue'
        datatype:
          description: 'An annotation of what datatype this node is supposed to be. Conventionally, this is a Python-format type annotation, but it’s purely for documentation purposes and not validated.

            '
          type:
          - string
          - 'null'
    ArrayActions:
      description: actions a user can take on an array
      type: string
      enum:
      - read
      - write
      - edit
      - read_array_logs
      - read_array_info
      - read_array_schema
    TaskGraphLog:
      description: Logging information about the execution of a task graph.
      type: object
      properties:
        uuid:
          type: string
          readOnly: true
          description: The server-generated UUID of the task graph.
        namespace:
          type: string
          description: 'The namespace that owns this task graph log. When creating a task graph log, this is used as the namespace to create the log in; thereafter it is read-only.

            '
        created_by:
          type: string
          readOnly: true
          description: The name of the user who created this task graph log.
        name:
          type: string
          description: 'A name for this task graph log, displayed in the UI. Does not need to be unique.

            '
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: 'The date/time when this task graph log was originally created. This is distinct from the execution start_time.

            '
        start_time:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
          x-omitempty: true
          description: 'The start time of the task graph, recorded when the server starts executing the first node.

            '
        end_time:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
          x-omitempty: true
          description: 'The end time of the task graph, recorded when the client reports completion.

            '
        status:
          $ref: '#/components/schemas/TaskGraphLogStatus'
        total_cost:
          type:
          - number
          - 'null'
          description: 'If present, the total cost of executing all nodes in this task graph.

            '
        access_cost:
          type:
          - number
          - 'null'
          description: 'If present, the total cost of access from execution of the nodes in this task graph.

            '
        egress_cost:
          type:
          - number
          - 'null'
          description: 'If present, the total cost of access from execution of the nodes in this task graph.

            '
        execution_time:
          type: string
          description: 'The total execution time of all the nodes in this graph, in ISO 8601 format with hours, minutes, and seconds.

            '
          example: P15H22M0.45S
        status_count:
          type: object
          description: 'A mapping from `ArrayTaskStatus` string value to the number of nodes in this graph that are in that status.

            '
          additionalProperties:
            description: The number of nodes that are in the given state.
            type: number
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/TaskGraphNodeMetadata'
          description: 'The structure of the graph. This is provided by the client when first setting up the task graph. Thereafter, it is read-only. This must be topographically sorted; that is, each node must appear after all nodes that it depends upon.

            '
        task_graph_type:
          $ref: '#/components/schemas/TaskGraphType'
        task_graph_id:
          type: string
          description: The UUID of the task graph.
        cloud_provider:
          type: string
          x-omitempty: true
          description: The name of the cloud provider where this task graph executed.
        cloud_region:
          type: string
          x-omitempty: true
          description: The region of the cloud provider where this task graph executed.
    TaskGraphLogRunLocation:
      description: 'The location where an individual node of a task graph is executed.

        '
      type: string
      enum:
      - server
      - client
      - virtual
    RetryStrategy:
      description: RetryStrategy provides controls on how to retry a taskgraph node
      type: object
      properties:
        backoff:
          description: Backoff is a backoff strategy
          $ref: '#/components/schemas/Backoff'
        expression:
          description: Expression is a condition expression for when a node will be retried. If it evaluates to false, the node will not be retried and the retry strategy will be ignored
          type: string
        limit:
          description: Limit is the maximum number of retry attempts when retrying a container. It does not include the original container; the maximum number of total attempts will be `limit + 1`.
          type: integer
          format: uint32
        retryPolicy:
          description: RetryPolicy is a policy of NodePhase statuses that will be retried
          $ref: '#/components/schemas/RetryPolicy'
    PricingAggregateUsage:
      description: Specifies a usage aggregation strategy for pricings of usage_type=metered
      type: string
      enum:
      - sum
    TaskGraphLogStatus:
      description: The status of a given task graph execution.
      type: string
      enum:
      - submitted
      - running
      - idle
      - abandoned
      - succeeded
      - failed
      - cancelled
    TaskGraphType:
      description: 'The type of a task graph.

        '
      type: string
      enum:
      - batch
      - realtime
    ArrayType:
      description: TileDB array type
      type: string
      enum:
      - dense
      - sparse
    ActivityEventType:
      description: Type of activity logged
      type: string
      enum:
      - read_schema
      - max_buffer_sizes
      - non_empty_domain
      - query_read
      - query_write
      - query_delete
      - create
      - delete
      - register
      - deregister
      - udf
      - array_metadata_get
      - array_metadata_update
      - estimated_result_sizes
      - read_fragment_info
      - read_enumerations
    ArrayInfo:
      description: metadata of an array
      type: object
      properties:
        id:
          description: unique ID of registered array
          type: string
          example: 00000000-0000-0000-0000-000000000000
        file_type:
          description: File type stored /wrapped by this array
          x-omitempty: true
          $ref: '#/components/schemas/FileType'
        file_properties:
          type: object
          description: map of file properties created for this array
          x-omitempty: true
          additionalProperties:
            type: string
        uri:
          description: uri of array
          type: string
          example: s3://bucket/array
        namespace:
          description: namespace array is in
          type: string
          example: user1
        size:
          description: size in bytes of array
          type:
          - number
          - 'null'
          format: uint64
          example: 1024
        last_accessed:
          description: Datetime array was last accessed in UTC
          type: string
          format: date-time
        description:
          description: description of array
          type:
          - string
          - 'null'
        name:
          description: name of array
          type: string
          example: myarray1
        allowed_actions:
          description: list of actions user is allowed to do on this array
          type: array
          x-omitempty: true
          items:
            $ref: '#/components/schemas/ArrayActions'
        pricing:
          description: list of pricing created for this array
          type: array
          x-omitempty: true
          items:
            $ref: '#/components/schemas/Pricing'
        subscriptions:
          description: list of subscriptions created for this array
          type: array
          x-omitempty: true
          items:
            $ref: '#/components/schemas/Subscription'
        logo:
          description: logo (base64 encoded) for the array. Optional
          type: string
        access_credentials_name:
          description: the name of the access credentials to use. if unset, the default credentials will be used
          type: string
        type:
          description: Array type (dense, key-value, sparse). Calculation of array type runs after array has been registered. So, it is not available immediately.
          example: sparse
          $ref: '#/components/schemas/ArrayType'
        share_count:
          description: number of unique namespaces this array is shared with
          type: number
          format: int32
        public_share:
          description: Suggests if the array was shared to public by owner
          type: boolean
          x-omitempty: false
          example: true
        namespace_subscribed:
          description: Depends on the namespace asking, denotes the existence of subscription of namespace to this array
          type: boolean
          readOnly: true
          example: false
        tiledb_uri:
          description: uri for access through TileDB cloud
          type: string
          x-omitempty: false
        tags:
          description: optional tags for array
          x-omitempty: false
          type: array
          items:
            type: string
            description: tag must be lowercase characters or hypen [a-z-]
        license_id:
          type: string
          x-omitempty: true
          description: License identifier from SPDX License List or Custom
        license_text:
          type: string
          x-omitempty: true
          description: License text
        read_only:
          description: Suggests if the array is in read_only mode
          type:
          - boolean
          - 'null'
          example: false
        is_favorite:
          description: Indicates whether the array is in user favorites
          type: boolean
          x-omitempty: true
          example: true
        created_at:
          description: Datetime array was registered with tiledb
          type: string
          format: date-time
        created_by:
          description: The user who created the array, if known.
          type: string
          x-omitempty: true
        metadata:
          description: 'Contains the metadata of the array.

            **Note:** This property is included in the response only if the `with_metadata` query parameter is set to `true`.

            '
          type: array
          x-omitempty: true
          items:
            $ref: '#/components/schemas/MetadataStringifiedEntry'
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-TILEDB-REST-API-KEY
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          scopes:
            read: Grants read access
            write: Grants write access
            admin: Grants read and write access to administrative information
          authorizationUrl: https://oauth2.tiledb.com/oauth2/authorize
          tokenUrl: https://oauth2.tiledb.com/oauth2/token
