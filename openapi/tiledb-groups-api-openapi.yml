openapi: 3.2.0
info:
  title: Tiledb Groups API
  version: '1.0'
  description: 'Operations tagged groups across 2 of this provider''s published API definitions: tiledb-cloud-v1-openapi.yaml, tiledb-cloud-v2-openapi.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: /v1
- url: /v2
security:
- BasicAuth: []
- ApiKeyAuth: []
tags:
- name: Groups
paths:
  /groups/browser/owned/filters:
    get:
      tags:
      - Groups
      description: Fetch data to initialize filters for the groups browser
      parameters:
      - name: namespace
        in: query
        description: namespace
        required: false
        schema:
          type: string
      responses:
        200:
          description: Filter data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupBrowserFilterData'
        502:
          description: Bad Gateway
        default:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: Get groups browser owned filters
      x-summary-source: derived
      operationId: getGroupsBrowserOwnedFilters
      x-operation-id-source: derived
    servers:
    - url: /v1
  /groups/browser/owned:
    get:
      description: Returns one page of owned groups.
      operationId: listOwnedGroups
      tags:
      - Groups
      parameters:
      - name: page
        in: query
        description: pagination offset
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        description: pagination limit
        required: false
        schema:
          type: integer
      - name: group_type
        in: query
        description: filter by a specific group type
        required: false
        schema:
          type: string
      - name: search
        in: query
        description: search string that will look at name, namespace or description fields
        required: false
        schema:
          type: string
      - name: namespace
        in: query
        description: namespace
        required: false
        schema:
          type: string
      - name: orderby
        in: query
        description: sort by which field valid values include last_accessed, size, name
        required: false
        schema:
          type: string
      - name: permissions
        in: query
        description: permissions valid values include read, read_write, write, admin
        required: false
        schema:
          type: string
      - name: tag
        in: query
        description: tag to search for, more than one can be included
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: exclude_tag
        in: query
        description: tags to exclude matching array in results, more than one can be included
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: flat
        in: query
        description: if true, ignores the nesting of groups and searches all of them
        schema:
          type: boolean
      - name: parent
        in: query
        description: search only the children of the groups with this uuid
        required: false
        schema:
          type: string
      - name: with_metadata
        in: query
        description: include the metadata of the groups
        required: false
        schema:
          type: boolean
      responses:
        200:
          description: the group contents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupBrowserData'
        502:
          description: Bad Gateway
        default:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: List owned groups
      x-summary-source: derived
    servers:
    - url: /v1
  /groups/browser/shared/filters:
    get:
      tags:
      - Groups
      description: Fetch data to initialize filters for the groups browser
      parameters:
      - name: namespace
        in: query
        description: namespace
        required: false
        schema:
          type: string
      responses:
        200:
          description: Filter data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupBrowserFilterData'
        502:
          description: Bad Gateway
        default:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: Get groups browser shared filters
      x-summary-source: derived
      operationId: getGroupsBrowserSharedFilters
      x-operation-id-source: derived
    servers:
    - url: /v1
  /groups/browser/shared:
    get:
      description: Returns one page of shared groups.
      operationId: listSharedGroups
      tags:
      - Groups
      parameters:
      - name: page
        in: query
        description: pagination offset
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        description: pagination limit
        required: false
        schema:
          type: integer
      - name: group_type
        in: query
        description: filter by a specific group type
        required: false
        schema:
          type: string
      - name: search
        in: query
        description: search string that will look at name, namespace or description fields
        required: false
        schema:
          type: string
      - name: namespace
        in: query
        description: namespace
        required: false
        schema:
          type: string
      - name: orderby
        in: query
        description: sort by which field valid values include last_accessed, size, name
        required: false
        schema:
          type: string
      - name: permissions
        in: query
        description: permissions valid values include read, read_write, write, admin
        required: false
        schema:
          type: string
      - name: tag
        in: query
        description: tag to search for, more than one can be included
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: exclude_tag
        in: query
        description: tags to exclude matching array in results, more than one can be included
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: flat
        in: query
        description: if true, ignores the nesting of groups and searches all of them
        schema:
          type: boolean
      - name: parent
        in: query
        description: search only the children of the groups with this uuid
        required: false
        schema:
          type: string
      - name: shared_to
        in: query
        description: namespaces to filter results of where there groups were shared to
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: with_metadata
        in: query
        description: include the metadata of the groups
        required: false
        schema:
          type: boolean
      responses:
        200:
          description: the group contents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupBrowserData'
        502:
          description: Bad Gateway
        default:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: List shared groups
      x-summary-source: derived
    servers:
    - url: /v1
  /groups/browser/public/filters:
    get:
      tags:
      - Groups
      description: Fetch data to initialize filters for the groups browser
      responses:
        200:
          description: Filter data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupBrowserFilterData'
        502:
          description: Bad Gateway
        default:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: Get groups browser public filters
      x-summary-source: derived
      operationId: getGroupsBrowserPublicFilters
      x-operation-id-source: derived
    servers:
    - url: /v1
  /groups/browser/public:
    get:
      description: Returns one page of public groups.
      operationId: listPublicGroups
      tags:
      - Groups
      parameters:
      - name: page
        in: query
        description: pagination offset
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        description: pagination limit
        required: false
        schema:
          type: integer
      - name: group_type
        in: query
        description: filter by a specific group type
        required: false
        schema:
          type: string
      - name: search
        in: query
        description: search string that will look at name, namespace or description fields
        required: false
        schema:
          type: string
      - name: namespace
        in: query
        description: namespace
        required: false
        schema:
          type: string
      - name: orderby
        in: query
        description: sort by which field valid values include last_accessed, size, name
        required: false
        schema:
          type: string
      - name: permissions
        in: query
        description: permissions valid values include read, read_write, write, admin
        required: false
        schema:
          type: string
      - name: tag
        in: query
        description: tag to search for, more than one can be included
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: exclude_tag
        in: query
        description: tags to exclude matching array in results, more than one can be included
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: flat
        in: query
        description: if true, ignores the nesting of groups and searches all of them
        schema:
          type: boolean
      - name: parent
        in: query
        description: search only the children of the groups with this uuid
        required: false
        schema:
          type: string
      - name: with_metadata
        in: query
        description: include the metadata of the groups
        required: false
        schema:
          type: boolean
      responses:
        200:
          description: the group contents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupBrowserData'
        502:
          description: Bad Gateway
        default:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: List public groups
      x-summary-source: derived
    servers:
    - url: /v1
  /groups/{group_namespace}/{group_name}/contents/filters:
    parameters:
    - name: group_namespace
      in: path
      required: true
      description: The namespace of the group
      schema:
        type: string
    - name: group_name
      in: path
      required: true
      description: The unique name or id of the group
      schema:
        type: string
    get:
      tags:
      - Groups
      description: Fetch data to initialize filters for the group contents
      responses:
        200:
          description: Filter data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupContentsFilterData'
        502:
          description: Bad Gateway
        default:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: Get groups by group namespace by group name contents filters
      x-summary-source: derived
      operationId: getGroupsByGroupNamespaceByGroupNameContentsFilters
      x-operation-id-source: derived
    servers:
    - url: /v1
  /groups/{group_namespace}/{group_name}/contents:
    parameters:
    - name: group_namespace
      in: path
      required: true
      description: The namespace of the group
      schema:
        type: string
    - name: group_name
      in: path
      required: true
      description: The unique name or id of the group
      schema:
        type: string
    post:
      description: Changes the contents of the group by adding/removing members.
      operationId: changeGroupContents
      tags:
      - Groups
      responses:
        204:
          description: all changes applied successfully
        502:
          description: Bad Gateway
        default:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupChanges'
      summary: Change group contents
      x-summary-source: derived
    get:
      description: Returns the contents of the group
      operationId: getGroupContents
      tags:
      - Groups
      parameters:
      - name: page
        in: query
        description: pagination offset for assets
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        description: pagination limit for assets
        required: false
        schema:
          type: integer
      - name: namespace
        in: query
        description: namespace to search for
        required: false
        schema:
          type: string
      - name: search
        in: query
        description: search string that will look at name, namespace or description fields
        required: false
        schema:
          type: string
      - name: orderby
        in: query
        description: sort by which field valid values include last_accessed, size, name
        required: false
        schema:
          type: string
      - name: tag
        in: query
        description: tag to search for, more than one can be included
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: exclude_tag
        in: query
        description: tags to exclude matching array in results, more than one can be included
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: member_type
        in: query
        description: member type to search for, more than one can be included
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: exclude_member_type
        in: query
        description: member type to exclude matching groups in results, more than one can be included
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      responses:
        200:
          description: the group contents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupContents'
        502:
          description: Bad Gateway
        default:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: Get group contents
      x-summary-source: derived
    servers:
    - url: /v1
  /groups/{namespace}/{array}/register:
    parameters:
    - name: namespace
      in: path
      required: true
      description: The namespace of the group
      schema:
        type: string
    - name: array
      in: path
      required: true
      description: The unique name or id of the group
      schema:
        type: string
    post:
      description: Registers an existing group in the namespace.
      operationId: registerGroup
      tags:
      - Groups
      responses:
        204:
          description: group created successfully
        502:
          description: Bad Gateway
        default:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupRegister'
      summary: Register group
      x-summary-source: derived
    servers:
    - url: /v1
  /groups/{namespace}/create:
    parameters:
    - name: namespace
      in: path
      required: true
      description: The namespace of the group
      schema:
        type: string
    post:
      description: Creates a new group in the namespace.
      operationId: createGroup
      tags:
      - Groups
      responses:
        204:
          description: group created successfully
        502:
          description: Bad Gateway
        default:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreate'
      summary: Create group
      x-summary-source: derived
    servers:
    - url: /v1
  /groups/{group_namespace}/{group_name}/share:
    parameters:
    - name: group_namespace
      in: path
      required: true
      description: The namespace of the group
      schema:
        type: string
    - name: group_name
      in: path
      required: true
      description: The unique name or id of the group
      schema:
        type: string
    get:
      description: Get all sharing details of the group
      tags:
      - Groups
      operationId: getGroupSharingPolicies
      responses:
        200:
          description: List of all specific sharing policies
          content:
            application/json:
              schema:
                type: array
                x-omitempty: true
                items:
                  $ref: '#/components/schemas/GroupSharing'
        404:
          description: Group does not exist or user does not have permissions to view group-sharing policies
        502:
          description: Bad Gateway
        default:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: Get group sharing policies
      x-summary-source: derived
    patch:
      description: Share a group with a namespace
      tags:
      - Groups
      operationId: shareGroup
      responses:
        204:
          description: Group shared successfully
        404:
          description: Group does not exist or user does not have permissions to share group
        502:
          description: Bad Gateway
        default:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupSharingRequest'
        description: Namespace and list of permissions to share with. Sharing is recursive, it is applied to all reachable subgroups and arrays of the group. An empty list of permissions will remove the namespace; if permissions already exist they will be deleted then new ones added. In the event of a failure, the new policies will be rolled back to prevent partial policies, and it's likely the group will not be shared with the namespace at all.
        required: true
      summary: Share group
      x-summary-source: derived
    servers:
    - url: /v1
  /groups/{group_namespace}/{group_name}:
    parameters:
    - name: group_namespace
      in: path
      required: true
      description: The namespace of the group
      schema:
        type: string
    - name: group_name
      in: path
      required: true
      description: The unique name or id of the group
      schema:
        type: string
    get:
      description: Returns the the group
      operationId: getGroup
      tags:
      - Groups
      responses:
        200:
          description: the group metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupInfo'
        502:
          description: Bad Gateway
        default:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: Get group
      x-summary-source: derived
    patch:
      description: Changes attributes of the group
      operationId: updateGroup
      tags:
      - Groups
      responses:
        204:
          description: attributes changed successfully
        502:
          description: Bad Gateway
        default:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupUpdate'
      summary: Update group
      x-summary-source: derived
    delete:
      description: Deletes the group. The assets are not deleted nor are not relocated to any other group
      operationId: deleteGroup
      tags:
      - Groups
      responses:
        204:
          description: group deleted successfully
        502:
          description: Bad Gateway
        default:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: Delete group
      x-summary-source: derived
    options:
      description: can be used to check if the resource exists
      tags:
      - Groups
      responses:
        404:
          description: the resource does not exist
        204:
          description: the resource exists
        502:
          description: Bad Gateway
        default:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: Describe groups by group namespace by group name
      x-summary-source: derived
      operationId: optionsGroupsByGroupNamespaceByGroupName
      x-operation-id-source: derived
    post:
      description: Retrieves the contents of a group
      operationId: retrieveGroup
      tags:
      - Groups
      responses:
        200:
          description: group created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupContentsRetrievalResponse'
        502:
          description: Bad Gateway
        default:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupContentsRetrievalRequest'
      summary: Retrieve group
      x-summary-source: derived
    servers:
    - url: /v1
  /groups/{group_namespace}/{group_name}/content_activity:
    parameters:
    - name: group_namespace
      in: path
      required: true
      description: The namespace of the group
      schema:
        type: string
    - name: group_name
      in: path
      required: true
      description: The unique name or id of the group
      schema:
        type: string
    - name: page
      in: query
      description: pagination offset
      required: false
      schema:
        type: integer
    - name: per_page
      in: query
      description: pagination limit
      required: false
      schema:
        type: integer
    get:
      description: Returns the activity of group content
      operationId: getGroupActivity
      tags:
      - Groups
      responses:
        200:
          description: Activity logs of group contents along with the pagination metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupContentActivityResponse'
        502:
          description: Bad Gateway
        default:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: Get group activity
      x-summary-source: derived
    servers:
    - url: /v1
  /groups/{group_namespace}/{group_name}/metadata:
    parameters:
    - name: group_namespace
      in: path
      required: true
      description: The namespace of the group
      schema:
        type: string
    - name: group_name
      in: path
      required: true
      description: The unique name or id of the group
      schema:
        type: string
    post:
      operationId: getGroupMetadata
      description: get metadata on a group using the requested config
      tags:
      - Groups
      responses:
        200:
          description: retrieve metadata for a group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metadata'
        502:
          description: Bad Gateway
        default:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupMetadataRetrievalRequest'
      summary: Get group metadata
      x-summary-source: derived
    put:
      operationId: updateGroupMetadata
      description: update metadata on a group
      tags:
      - Groups
      responses:
        200:
          description: group metadata updated successfully
        502:
          description: Bad Gateway
        default:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupMetadataUpdateRequest'
      summary: Update group metadata
      x-summary-source: derived
    servers:
    - url: /v2
  /groups/{group_namespace}:
    parameters:
    - name: group_namespace
      in: path
      required: true
      description: The namespace of the group
      schema:
        type: string
    - name: X-TILEDB-CLOUD-ACCESS-CREDENTIALS-NAME
      in: header
      description: Optional registered access credentials to use for creation
      required: false
      schema:
        type: string
    post:
      description: Creates an empty group
      operationId: createGroup
      tags:
      - Groups
      responses:
        201:
          description: group created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupCreationResponse'
        502:
          description: Bad Gateway
        default:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreationRequest'
      summary: Create group
      x-summary-source: derived
    put:
      description: Registers an already existing group
      operationId: registerGroup
      tags:
      - Groups
      responses:
        201:
          description: group created successfully
        502:
          description: Bad Gateway
        default:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupRegistrationRequest'
      summary: Register group
      x-summary-source: derived
    servers:
    - url: /v2
  /groups/{group_namespace}/{group_name}/delete:
    parameters:
    - name: group_namespace
      in: path
      required: true
      description: The namespace of the group
      schema:
        type: string
    - name: group_name
      in: path
      required: true
      description: The unique name or id of the group
      schema:
        type: string
    - name: recursive
      in: query
      description: If true, it descends in the group and deletes every subgroup and subarray
      required: false
      schema:
        type: string
    delete:
      description: Deregisters and physically deletes a group
      operationId: deleteGroup
      tags:
      - Groups
      responses:
