versioning:
  style: uri-path
  values:
  - /v1
  - /v2
  note: Two separately published Swagger 2.0 contracts sharing one host. v2 is not a replacement for v1 — it is a
    smaller, newer surface (21 operations, mostly groups and assets) that coexists with the 168-operation v1. info.version
    is bumped independently per contract (v1 2.17.51, v2 1.4.0) and is not exposed as a header or a discovery endpoint.
  see: lifecycle/tiledb-lifecycle.yml
content_negotiation:
  default: application/json
  alternate: application/capnp
  note: 'A genuinely unusual convention: the high-throughput array paths (query submit/finalize, array schema load,
    fragment info, array metadata, enumerations, est_result_sizes, non_empty_domain) negotiate Cap''n Proto instead
    of JSON. Some operations exist in BOTH forms as distinct operationIds — e.g. getArrayMetadata (capnp) alongside
    getArrayMetaDataJson, and updateArrayMetadataCapnp alongside updateArrayMetadata. An agent that speaks only JSON
    should prefer the *Json operationIds.'
  schema_source: https://github.com/TileDB-Inc/TileDB/blob/main/tiledb/sm/serialization/tiledb-rest.capnp
  other_media_types:
  - application/octet-stream (file export/upload)
  - multipart/form-data (file and notebook upload)
  - application/x-ipynb+json (notebook export)
pagination:
  style: page-number
  params:
  - name: page
    in: query
    type: integer
    description: Page to return; default 1.
  - name: per_page
    in: query
    type: integer
    description: Items per page.
  response_fields:
  - 'pagination_metadata (PaginationMetadata: page, per_page, total_pages, total_items)'
  note: Applied on the browser/listing endpoints (arrays browser owned/shared/public, groups browser, favorites, task
    graph logs, assets). Not every list endpoint is paginated.
