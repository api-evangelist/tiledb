  - deleteGroup
  - deleteUser
  - deleteOrganization
  - deleteUDFInfo
  - deleteRegisteredTaskGraph
  - deleteAWSAccessCredentials
  - deleteSSODomain
  - vacuumArray
  - consolidateArray
