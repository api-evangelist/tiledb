idempotency:
  supported: false
  header: null
  scope: null
  retention: null
  evidence: 'No idempotency key, header, or discussion appears anywhere in either published contract (grep for /idempoten/i
    across both files: 0 hits) or in the 423-page docs sitemap.'
  consequence: A retried POST — createArray, registerArray, submitUDF, submitTaskGraph, createGroup, shareArray —
    has no provider-supplied deduplication guarantee. Many of these are naturally idempotent by key (register/share
    by namespace+name), but that is a property of the resource model, not a contract TileDB states.
rate_limit_signaling:
  documented: false
  headers: []
  status_on_exhaustion: null
  note: No X-RateLimit-* / RateLimit-* headers, no 429 response, no Retry-After anywhere in either contract or the
    documentation. See rate-limits/tiledb-rate-limits.yml.
dry_run_mode:
  supported: false
  note: No dry-run/preview/validate-only parameter in either contract. The closest analogues are read-only estimators
    — getEstResultSizes, getArrayMaxBufferSizes, getArraySampleData and the consolidation-plan endpoints — which let
    a caller size a query before running it, but they do not rehearse a write.
reversibility:
  grade: documented
  grade_basis: Reversal operations exist and are named in the contract, but TileDB states no time window for any of
    them. A window is what would raise this to `verified`; inventing one is not an option.
  write_surface: true
  surfaces:
  - action: Submit a task graph execution
    operationId: submitTaskGraph
    reversal: stopTaskGraphExecution (POST /taskgraphs/{namespace}/executions/{id}/stop)
    window: null
    window_source: null
    note: A running execution can be stopped, and a failed one re-driven with retryTaskGraphExecution or resubmitTaskGraphExecution.
      No stated deadline; stopping is only meaningful while the execution runs.
  - action: Register an array into TileDB Cloud
    operationId: registerArray
    reversal: deregisterArray (DELETE /arrays/{namespace}/{array}/deregister)
    window: null
    window_source: null
    note: Deregistering removes the array from TileDB Cloud without deleting the underlying data in object storage
      — this is the reversible sibling of deleteArray, which the contract describes as deleting the array.
  - action: Delete an array
    operationId: deleteArray
    reversal: null
    window: null
    window_source: null
    note: No restore/undelete operation exists. Not reversible through the API.
  - action: Share an array or group
    operationId: shareArray (PATCH /arrays/{namespace}/{array}/share) / shareGroup
    reversal: No distinct unshare/revoke operation exists. Sharing is expressed as a PATCH carrying an ArraySharing.actions
      list, so revocation is a rewrite of that list.
    window: null
    window_source: null
    note: The contract does not state what an empty actions list does, so the exact revocation call is undocumented.
      getArraySharingPolicies / getGroupSharingPolicies let a caller read the current state before and after.
  - action: Invite a user to share an asset or join an organization
    operationId: shareArrayByInvite / joinOrganization
    reversal: cancelShareArrayByInvite, cancelShareGroupByInvite, cancelJoinOrganization, cancelSharePayment
    window: null
    window_source: null
    note: Pending invitations are explicitly cancellable — the cleanest reversal path in the API.
  - action: Issue a REST API token
    operationId: requestToken
    reversal: revokeToken (DELETE /tokens/{token})
    window: Bounded by the token expiry, which defaults to 30 minutes when none is set.
    window_source: https://documentation.cloud.tiledb.com/academy/accounts/individual/profile/api-tokens/
    note: The one reversal in the API with a provider-stated bound, and it is an expiry rather than an undo window.
  - action: Write to an array
    operationId: submitQuery / submitQueryJson
    reversal: Time travel — TileDB arrays are append-only with per-fragment timestamps, so a prior state is readable
      by opening the array at an earlier timestamp.
    window: Until the fragments are vacuumed (vacuumArray), which permanently removes them.
    window_source: https://documentation.cloud.tiledb.com/academy/structure/arrays/foundation/key-concepts/compute/time-traveling/
    note: This is a storage-format property rather than a REST reversal operation, but it is the mechanism an agent
      would actually use to undo a bad write. vacuumArray and consolidateArray are the operations that destroy that
      ability, and neither is reversible.
  irreversible_operations:
