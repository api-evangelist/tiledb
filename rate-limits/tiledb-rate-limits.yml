note: 'TileDB publishes no rate limits for the TileDB Cloud REST API. Neither contract declares a 429 response, a
  Retry-After header, or any X-RateLimit-* / RateLimit-* header, and no page in the docs sitemap covers throttling.
  What the platform meters instead is CONSUMPTION, not request rate: pricing is sold in vCPUs and user seats, and
  individual accounts run against a credit balance (the free tier grants $100 of credits for six months). The one
  payment-shaped ceiling the contract exposes is a 402 Payment Required on getNotebookServerStatus (GET /notebooks/server/{namespace}/status),
  which is a credit/billing signal rather than a rate limit.'
